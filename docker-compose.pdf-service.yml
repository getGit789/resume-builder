version: '3'

services:
  pdf-service:
    build:
      context: ./pdf-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MAX_CONCURRENT_JOBS=5
      - LOG_LEVEL=info
      - REQUEST_TIMEOUT=60000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - pdf-service-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  pdf-service-data: 