name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Playwright Tests
    needs: lint
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_builder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Set up environment
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/resume_builder_test?schema=public" >> .env
        echo "REDIS_URL=redis://localhost:6379" >> .env
        echo "NEXTAUTH_SECRET=test-secret-for-ci" >> .env
        echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Apply database migrations
      run: npx prisma migrate deploy
      
    - name: Run Playwright tests
      run: npx playwright test
      
    - name: Test PDF generation
      run: node scripts/test-pdf-generation.js
      
    - uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30 